    <!-- ── FOUC Prevention ─────────────────────────────────────────
         This blocking script runs before React hydrates to apply
         the correct theme without any flash. Reads localStorage
         and falls back to system preference.
    ────────────────────────────────────────────────────────────── -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ibk-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored ? stored === "dark" : prefersDark;
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          document.documentElement.style.background = dark ? "#050508" : "#fafafa";
        } catch (e) {}
      })();
    </script>

    <style>
      /* Prevent any layout shift during load */
      html, body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      body[data-theme="dark"] { background: #050508; }
      body[data-theme="light"] { background: #fafafa; }

      /* Loading state */
      #root:empty::after {
        content: '';
        position: fixed;
        inset: 0;
        background: #050508;
        z-index: 99999;
      }
    </style>
  </head>
